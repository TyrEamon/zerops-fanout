zerops:
  - setup: fanout
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker build --pull -t fanout-zerops:latest .
        - docker image prune -f || true
      start: |
        docker rm -f fanout 2>/dev/null || true
        docker volume create fanout-data >/dev/null
        exec docker run --rm --name fanout \
          --privileged \
          --network=host \
          -v fanout-data:/var/lib/fanout \
          -e WEB_PORT=8899 \
          -e WORK_DIR=/var/lib/fanout \
          -e MAX_SLOTS=20 \
          fanout-zerops:latest
      ports:
        - port: 8899
          protocol: TCP
          httpSupport: true
        - port: 20000
          protocol: TCP
        - port: 20001
          protocol: TCP
        - port: 20002
          protocol: TCP
        - port: 20003
          protocol: TCP
        - port: 20004
          protocol: TCP
        - port: 20005
          protocol: TCP
        - port: 20006
          protocol: TCP
        - port: 20007
          protocol: TCP
        - port: 20008
          protocol: TCP
        - port: 20009
          protocol: TCP
        - port: 20010
          protocol: TCP
        - port: 20011
          protocol: TCP
        - port: 20012
          protocol: TCP
        - port: 20013
          protocol: TCP
        - port: 20014
          protocol: TCP
        - port: 20015
          protocol: TCP
        - port: 20016
          protocol: TCP
        - port: 20017
          protocol: TCP
        - port: 20018
          protocol: TCP
        - port: 20019
          protocol: TCP
