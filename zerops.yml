zerops:
  - setup: fanout
    build:
      base: go@1.22
      envVariables:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
      buildCommands:
        - go mod download
        - go build -trimpath -ldflags "-s -w -X main.version=zerops-docker" -o fanout .
      deployFiles:
        - fanout
        - docker-entrypoint.sh
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker image pull alpine:3.20
      start: |
        set -eu
        LOG=/var/www/fanout-start.log
        {
          echo "=== fanout start $(date -Iseconds) ==="
          id
          pwd
          ls -la /var/www
          docker ps -a || true
          docker volume create fanout-data
          if docker ps -a --format '{{.Names}}' | grep -qx fanout; then
            echo "fanout container already exists, starting it"
            docker start fanout || true
          else
            echo "creating fanout container"
            docker create --name fanout \
              --privileged \
              --network=host \
              -v fanout-data:/var/lib/fanout \
              -v /var/www:/app:ro \
              -e WEB_PORT=8899 \
              -e WORK_DIR=/var/lib/fanout \
              -e MAX_SLOTS=20 \
              alpine:3.20 sh -eux -c 'id; uname -a; ls -la /app; apk add --no-cache bash ca-certificates curl iproute2 iptables openvpn; cp /app/fanout /usr/local/bin/fanout; cp /app/docker-entrypoint.sh /usr/local/bin/docker-entrypoint.sh; chmod +x /usr/local/bin/fanout /usr/local/bin/docker-entrypoint.sh; /usr/local/bin/fanout -version; exec /usr/local/bin/docker-entrypoint.sh'
            docker start fanout
          fi
          docker ps -a
        } 2>&1 | tee "$LOG"
        while true; do
          docker logs --tail 200 fanout 2>&1 || true
          sleep 30
        done
      ports:
        - port: 8899
          httpSupport: true
        - port: 20000
        - port: 20001
        - port: 20002
        - port: 20003
        - port: 20004
        - port: 20005
        - port: 20006
        - port: 20007
        - port: 20008
        - port: 20009
        - port: 20010
        - port: 20011
        - port: 20012
        - port: 20013
        - port: 20014
        - port: 20015
        - port: 20016
        - port: 20017
        - port: 20018
        - port: 20019
