zerops:
  - setup: fanout
    build:
      base: go@1.22
      envVariables:
        GOPROXY: https://goproxy.cn,direct
        CGO_ENABLED: "0"
      buildCommands:
        - go mod download
        - go build -trimpath -ldflags "-s -w -X main.version=zerops-docker" -o fanout .
      deployFiles:
        - fanout
        - docker-entrypoint.sh
        - start.sh
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker image pull alpine:3.20
      start: /bin/sh /var/www/start.sh
      ports:
        - port: 8899
          httpSupport: true
        - port: 20000
        - port: 20001
        - port: 20002
        - port: 20003
        - port: 20004
        - port: 20005
        - port: 20006
        - port: 20007
        - port: 20008
        - port: 20009
        - port: 20010
        - port: 20011
        - port: 20012
        - port: 20013
        - port: 20014
        - port: 20015
        - port: 20016
        - port: 20017
        - port: 20018
        - port: 20019
