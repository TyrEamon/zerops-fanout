zerops:
  - setup: fanout
    run:
      base: alpine/docker@26.1.5
      prepareCommands:
        - docker build --pull -t fanout-zerops:latest .
        - docker image prune -f || true
      start: |
        docker rm -f fanout 2>/dev/null || true
        docker volume create fanout-data >/dev/null
        exec docker run --rm --name fanout \
          --privileged \
          --network=host \
          -v fanout-data:/var/lib/fanout \
          -e WEB_PORT=8899 \
          -e WORK_DIR=/var/lib/fanout \
          -e MAX_SLOTS=20 \
          fanout-zerops:latest
      ports:
        - port: 8899
          httpSupport: true
        - port: 20000
        - port: 20001
        - port: 20002
        - port: 20003
        - port: 20004
        - port: 20005
        - port: 20006
        - port: 20007
        - port: 20008
        - port: 20009
        - port: 20010
        - port: 20011
        - port: 20012
        - port: 20013
        - port: 20014
        - port: 20015
        - port: 20016
        - port: 20017
        - port: 20018
        - port: 20019
